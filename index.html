<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sucker Punch Pub Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800;900&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
:root{
  --ink:#0A0A0A; --panel:#141414; --panel2:#1C1C1C; --line:#2A2A28; --line2:#3C3C38;
  --bone:#F4F1E6; --dim:#9C9A90; --faint:#6A6863;
  --bad:#E4552B;
  --yl:#F2C10D; --yl-hi:#FFD634; --yl-lo:#6E5806; --yl-soft:rgba(242,193,13,.12);
  --display:"Big Shoulders Display","Haettenschweiler","Arial Narrow",sans-serif;
  --body:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ink); color:var(--bone);
  font-family:var(--body); font-size:16px; line-height:1.5; min-height:100vh;
  background-image:radial-gradient(1100px 620px at 50% -12%, rgba(242,193,13,.09), transparent 62%);
  background-attachment:fixed;
}
button{font-family:inherit; color:inherit; cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--yl); outline-offset:3px}
h1,h2,h3{margin:0; text-wrap:balance}
.app{max-width:1200px; margin:0 auto; padding:0 22px 60px; display:flex; flex-direction:column; min-height:100vh}

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:18px;
  padding:14px 0 12px; background:linear-gradient(var(--ink) 74%, rgba(10,10,10,0));
}
.brand{display:flex; align-items:baseline; gap:11px; background:none; border:0; padding:0}
.brand .mark{font-family:var(--display); font-weight:900; font-size:25px; letter-spacing:.03em; line-height:1; text-transform:uppercase}
.brand .mark em{color:var(--yl); font-style:normal}
.brand .sub{font-family:var(--mono); font-size:10px; letter-spacing:.24em; text-transform:uppercase; color:var(--faint)}
.rail{display:flex; gap:6px; margin-left:auto; flex-wrap:wrap}
.rchip{
  font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  background:var(--panel); border:1px solid var(--line); color:var(--dim);
  padding:7px 13px; border-radius:2px; transition:.15s;
}
.rchip:hover{border-color:var(--yl-lo); color:var(--bone)}
.rchip[aria-current="true"]{background:var(--yl); border-color:var(--yl); color:#100D00; font-weight:600}

/* ---------- primitives ---------- */
.panel{background:var(--panel); border:1px solid var(--line); border-radius:3px}
.stack{display:flex; flex-direction:column; gap:20px}
.bar{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:var(--faint)}
.dtitle{font-family:var(--display); font-weight:900; letter-spacing:.01em; line-height:.92; text-transform:uppercase}
.note{font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint)}
.hidden{display:none !important}
.rule{height:1px; background:linear-gradient(90deg,transparent,var(--line2),transparent); margin:8px 0}

.btn{
  font-family:var(--mono); font-size:12px; letter-spacing:.16em; text-transform:uppercase;
  background:var(--panel2); border:1px solid var(--line2); color:var(--bone);
  padding:11px 18px; border-radius:2px; transition:.15s;
}
.btn:hover{border-color:var(--yl); color:var(--yl)}
.btn.primary{background:var(--yl); border-color:var(--yl); color:#100D00; font-weight:600}
.btn.primary:hover{background:var(--yl-hi); color:#100D00}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.32; cursor:not-allowed}
.btn.sm{padding:8px 12px; font-size:11px}
.btn.big{padding:16px 30px; font-size:14px}
.btn.huge{padding:20px 46px; font-size:17px; letter-spacing:.2em}

/* ---------- title screen ---------- */
.hero{padding:34px 0 12px; text-align:center}
.hero .kick{font-family:var(--mono); font-size:11px; letter-spacing:.42em; text-transform:uppercase; color:var(--yl)}
.hero .dtitle{font-size:clamp(42px,8.6vw,104px); margin-top:4px}
.hero .dtitle em{font-style:normal; color:var(--yl); display:block}
.hero .tag{margin-top:16px; font-size:19px; color:var(--dim); font-style:italic}
.roundgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:14px; margin-top:26px}
.rcard{
  background:var(--panel); border:1px solid var(--line); border-radius:3px; padding:22px;
  text-align:left; display:flex; flex-direction:column; gap:12px; transition:.18s;
}
.rcard:hover{border-color:var(--yl); transform:translateY(-2px)}
.rcard .no{font-family:var(--display); font-weight:900; font-size:50px; line-height:.78; color:var(--line2)}
.rcard:hover .no{color:var(--yl)}
.rcard h3{font-family:var(--display); font-weight:700; font-size:28px; text-transform:uppercase}
.rcard .cnt{font-family:var(--mono); font-size:11px; letter-spacing:.12em; color:var(--faint)}
.diffpill{
  align-self:flex-start; font-family:var(--mono); font-size:10px; letter-spacing:.2em; text-transform:uppercase;
  padding:4px 10px; border-radius:2px; border:1px solid var(--line2); color:var(--dim);
}
.diffpill.hot{border-color:var(--yl-lo); color:var(--yl); background:var(--yl-soft)}

/* ---------- rules card (round intro) ---------- */
.intro{flex:1; display:flex; flex-direction:column; justify-content:center; gap:30px; padding:26px 0 10px; text-align:center; align-items:center}
.intro .no{font-family:var(--display); font-weight:900; font-size:clamp(66px,13vw,150px); line-height:.8; color:var(--yl)}
.intro h2{font-family:var(--display); font-weight:900; font-size:clamp(38px,7vw,80px); text-transform:uppercase; line-height:.95}
.rulebox{
  background:var(--panel); border:1px solid var(--line); border-top:3px solid var(--yl);
  border-radius:3px; padding:30px 40px; max-width:760px; width:100%; text-align:left;
}
.rulebox ol{margin:0; padding:0; list-style:none; counter-reset:r; display:flex; flex-direction:column; gap:15px}
.rulebox li{counter-increment:r; display:flex; gap:16px; align-items:baseline; font-size:clamp(17px,2.1vw,23px); line-height:1.4}
.rulebox li::before{
  content:counter(r,decimal-leading-zero); font-family:var(--mono); font-size:12px; color:var(--yl);
  border:1px solid var(--yl-lo); padding:3px 7px; border-radius:2px; flex:none;
}

/* ---------- stage ---------- */
.stage{flex:1; display:flex; flex-direction:column; gap:20px; padding-top:4px}
.stagehead{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.stagehead .dtitle{font-size:29px}
.counter{font-family:var(--mono); font-size:12px; letter-spacing:.16em; color:var(--faint); margin-left:auto; font-variant-numeric:tabular-nums}
.qcard{
  background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--yl);
  border-radius:3px; padding:44px 46px; display:flex; flex-direction:column; gap:28px;
  min-height:250px; justify-content:center;
}
.qtext{font-size:clamp(26px,3.7vw,46px); line-height:1.26; font-weight:500}
.answer{
  font-family:var(--mono); font-size:clamp(18px,2.1vw,25px); color:var(--yl);
  border-top:1px dashed var(--line2); padding-top:24px; animation:rise .22s ease-out;
}
@keyframes rise{from{opacity:0; transform:translateY(7px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}

.opts{display:grid; grid-template-columns:1fr 1fr; gap:12px}
@media(max-width:760px){.opts{grid-template-columns:1fr}}
.opt{display:flex; align-items:center; gap:15px; background:var(--panel2); border:1px solid var(--line); padding:16px 19px; border-radius:2px; font-size:clamp(17px,1.9vw,21px)}
.opt .lt{font-family:var(--mono); font-size:13px; color:var(--faint); border:1px solid var(--line2); width:27px; height:27px; display:grid; place-items:center; border-radius:2px; flex:none}
.opt.correct{border-color:var(--yl); background:var(--yl-soft)}
.opt.correct .lt{background:var(--yl); color:#100D00; border-color:var(--yl); font-weight:600}
.opt.pick{width:100%; text-align:left; font-family:var(--body); transition:.14s; cursor:pointer}
.opt.pick:hover{border-color:var(--yl); background:#242015}
.opt.wrong{border-color:var(--bad); background:rgba(228,85,43,.13)}
.opt.wrong .lt{background:var(--bad); color:#150703; border-color:var(--bad); font-weight:600}
.opt.dim{opacity:.42}
.opt.correct:hover,.opt.wrong:hover,.opt.dim:hover{background:var(--panel2); border-color:var(--line)}
.opt.correct:hover{border-color:var(--yl); background:var(--yl-soft)}
.opt.wrong:hover{border-color:var(--bad); background:rgba(228,85,43,.13)}
.verdict{
  font-family:var(--mono); font-size:clamp(15px,1.8vw,20px); letter-spacing:.02em;
  border-top:1px dashed var(--line2); padding-top:22px; animation:rise .2s ease-out;
}
.verdict.right{color:var(--yl)}
.verdict.wrong{color:var(--bad)}

/* timer */
.timerbar{display:flex; align-items:center; gap:16px}
.clock{font-family:var(--mono); font-size:46px; font-weight:500; font-variant-numeric:tabular-nums; min-width:124px}
.clock.warn{color:var(--yl)} .clock.out{color:var(--bad)}
.track{flex:1; height:5px; background:var(--panel2); border:1px solid var(--line); border-radius:99px; overflow:hidden}
.fill{height:100%; background:var(--yl); width:100%; transition:width .25s linear}
.fill.out{background:var(--bad)}

/* chips */
.chips{display:flex; gap:9px; flex-wrap:wrap}
.chip{font-family:var(--mono); font-size:12px; letter-spacing:.1em; background:var(--panel2); border:1px solid var(--line2); padding:10px 15px; border-radius:2px; color:var(--dim)}
.chip:hover{border-color:var(--yl); color:var(--bone)}
.chip[aria-pressed="true"]{background:var(--yl); border-color:var(--yl); color:#100D00; font-weight:600}

.handicaps{display:flex; flex-direction:column; gap:10px; margin-top:14px; padding-top:16px; border-top:1px solid var(--line)}
.chip.static{cursor:default; background:transparent; color:var(--faint); border-color:var(--line)}
.chip.static:hover{border-color:var(--line); color:var(--faint)}

.anslist{display:flex; flex-direction:column; border:1px solid var(--line); border-radius:3px; overflow:hidden}
.ansrow{display:grid; grid-template-columns:38px 1fr minmax(150px,.5fr); gap:14px; align-items:baseline;
  padding:11px 16px; border-bottom:1px solid var(--line); background:var(--panel)}
.ansrow:last-child{border-bottom:0}
.ansrow .n{font-family:var(--mono); font-size:11px; color:var(--faint)}
.ansrow .q{font-size:16px; color:var(--dim)}
.ansrow .a{font-family:var(--mono); font-size:15px; color:var(--yl)}
.ansrow.got{background:var(--yl-soft)}
.ansrow.got .q{color:var(--bone)}
@media(max-width:700px){.ansrow{grid-template-columns:30px 1fr; gap:6px} .ansrow .a{grid-column:2}}

/* tally */
.tally{display:flex; gap:12px; align-items:baseline; font-family:var(--mono)}
.tally .big{font-size:52px; color:var(--yl); font-variant-numeric:tabular-nums; line-height:1}

/* header menu */
.menubtn{
  display:flex; flex-direction:column; justify-content:center; gap:4px; flex:none;
  width:40px; height:34px; padding:0 8px; background:var(--panel); border:1px solid var(--line);
  border-radius:2px; transition:.15s;
}
.menubtn span{display:block; height:2px; background:var(--dim); border-radius:1px; transition:.15s}
.menubtn:hover{border-color:var(--yl)}
.menubtn:hover span{background:var(--yl)}
.menubtn[aria-expanded="true"]{background:var(--yl); border-color:var(--yl)}
.menubtn[aria-expanded="true"] span{background:#100D00}
.menu[hidden]{display:none}
.menu{
  position:absolute; right:0; top:calc(100% + 4px); z-index:70; min-width:238px;
  background:var(--panel); border:1px solid var(--line2); border-radius:3px; padding:8px;
  display:flex; flex-direction:column; gap:6px; box-shadow:0 16px 44px rgba(0,0,0,.65);
}
.menu .btn{width:100%; text-align:left}
.menu .btn.arm{border-color:var(--bad); color:var(--bad)}
.menu .keys{
  font-family:var(--mono); font-size:10px; letter-spacing:.08em; color:var(--faint);
  line-height:2; padding:8px 4px 2px; border-top:1px solid var(--line); margin-top:2px;
}
kbd{border:1px solid var(--line2); border-bottom-width:2px; border-radius:2px; padding:1px 5px; margin-right:5px; color:var(--dim)}

/* logo */
.herologo{display:block; margin:0 auto 22px; width:auto; height:clamp(112px,17vw,182px)}
.lhword{
  display:inline-block; font-family:var(--display); font-weight:700; font-size:26px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--bone); border:1px solid var(--line2); padding:9px 20px;
  border-radius:2px; margin:0 auto 26px;
}
.lhword em{color:var(--yl); font-style:normal}

.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:74px; z-index:60; background:var(--panel2); border:1px solid var(--yl); font-family:var(--mono); font-size:13px; padding:11px 18px; border-radius:2px}
@media(max-width:640px){.qcard{padding:28px 22px} .clock{font-size:34px; min-width:96px} .rulebox{padding:22px}}
</style>

</head>

const S = {
  data: JSON.parse(JSON.stringify(DEFAULT_DATA)),
  custom: false,
  custom: false,
  screen: 'home',           // home | intro | round
  ri: 0,
  r1: {i:0, revealed:false},
  r2: {tier:'easy', q:null, revealed:false, used:{easy:[],hard:[]}, started:false},
  r3: {phase:'ready', q:null, used:[], count:0, seen:0, asked:[]},
  r4: {i:0, picked:null},
  t: {total:0, left:0, on:false, id:null}
};
const $ = s => document.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R = () => S.data.rounds[S.ri];
const qcount = r => (r.questions?r.questions.length:0) + (r.easyQuestions?r.easyQuestions.length+r.hardQuestions.length:0);

/* ---------- persistence (best effort) ---------- */
const KEY='sucker-punch-quiz-v3';
function save(){
  try{
    const out={screen:S.screen,ri:S.ri,r1:S.r1,r2:S.r2,r3:S.r3,r4:S.r4,custom:!!S.custom};
    if(S.custom) out.data=S.data;   // built-in questions are never cached — the file is the source of truth
    localStorage.setItem(KEY, JSON.stringify(out));
  }catch(e){}
}
function load(){ try{ const r=localStorage.getItem(KEY); return r?JSON.parse(r):null; }catch(e){ return null; } }
function wipe(){ try{ localStorage.removeItem(KEY); }catch(e){} }

let toastT;
function toast(msg){
  const old=$('.toast'); if(old) old.remove();
  const n=el('div','toast',esc(msg)); document.body.appendChild(n);
  clearTimeout(toastT); toastT=setTimeout(()=>n.remove(),2200);
}

/* ---------- timer ---------- */
function timerSet(sec){ stopTimer(); S.t.total=sec||0; S.t.left=sec||0; paintClock(); }
function startTimer(){
  if(S.t.on || S.t.left<=0) return;
  S.t.on=true;
  S.t.id=setInterval(()=>{ S.t.left--; paintClock(); if(S.t.left<=0){ stopTimer(); timeUp(); } },1000);
  paintClock();
}
function stopTimer(){ S.t.on=false; clearInterval(S.t.id); S.t.id=null; paintClock(); }
function toggleTimer(){ S.t.on?stopTimer():startTimer(); }
function timeUp(){
  toast('Time!'); try{ beep(); }catch(e){}
  if(R() && R().format==='rapid' && S.r3.phase==='run'){ S.r3.phase='done'; render(); }
}
function beep(){
  const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
  const a=new C(), o=a.createOscillator(), g=a.createGain();
  o.connect(g); g.connect(a.destination); o.type='square'; o.frequency.value=640;
  g.gain.setValueAtTime(.15,a.currentTime); g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.75);
  o.start(); o.stop(a.currentTime+.78);
}
function paintClock(){
  const c=$('#clock'); if(!c) return;
  const m=Math.floor(S.t.left/60), s=S.t.left%60;
  c.textContent=`${m}:${String(s).padStart(2,'0')}`;
  const frac=S.t.total? S.t.left/S.t.total : 0;
  const cls = S.t.left<=0?'out':(frac<=.25?'warn':'');
  c.className='clock '+cls;
  const f=$('#fill'); if(f){ f.style.width=(frac*100)+'%'; f.className='fill '+cls; }
  const b=$('#tbtn'); if(b) b.textContent=S.t.on?'Pause':'Start';
}
function timerBar(){
  return `<div class="timerbar">
    <div class="clock" id="clock">0:00</div>
    <div class="track"><div class="fill" id="fill"></div></div>
    <button class="btn sm" id="tbtn">Start</button>
    <button class="btn sm ghost" id="trst">Reset</button></div>`;
}
function wireTimer(){
  const b=$('#tbtn'); if(b) b.onclick=toggleTimer;
  const r=$('#trst'); if(r) r.onclick=()=>timerSet(S.t.total);
  paintClock();
}
function pickRandom(pool, used){
  const free=pool.map((_,i)=>i).filter(i=>!used.includes(i));
  return free.length? free[Math.floor(Math.random()*free.length)] : null;
}
function logoNode(){
  if(LOGO_SRC && LOGO_SRC.indexOf('__')!==0){
    const i=el('img','herologo'); i.src=LOGO_SRC; i.alt='Lighthaven India';
    return i;
  }
  return el('div','lhword','Light<em>haven</em> India');
}

/* ---------- render ---------- */
function render(){
  renderRail(); renderMenu();
  const v=$('#view'); v.innerHTML='';
  if(S.screen==='home') v.appendChild(viewHome());
  else if(S.screen==='intro') v.appendChild(viewIntro());
  else v.appendChild(viewRound());
  $('#brandsub').textContent = S.screen==='home' ? 'Pub quiz' : R().subtitle;
  wireTimer(); save();
}
function renderRail(){
  const rail=$('#rail'); rail.innerHTML='';
  S.data.rounds.forEach((r,i)=>{
    const b=el('button','rchip', r.name.replace('Round ','R'));
    b.title=r.subtitle;
    if(S.screen!=='home' && S.ri===i) b.setAttribute('aria-current','true');
    b.onclick=()=>openRound(i);
    rail.appendChild(b);
  });
}
function resetAll(){
  stopTimer();
  S.r1={i:0, revealed:false};
  S.r2={tier:'easy', q:null, revealed:false, used:{easy:[],hard:[]}, started:false};
  S.r3={phase:'ready', q:null, used:[], count:0, seen:0, asked:[]};
  S.r4={i:0, picked:null};
  S.ri=0; S.screen='home';
  wipe(); render(); save();
  toast('Start over — every round is back to the beginning');
}
function closeMenu(){ $('#menu').hidden=true; $('#menubtn').setAttribute('aria-expanded','false'); }
function renderMenu(){
  const m=$('#menu'); m.innerHTML='';
  const add=(l,fn)=>{const b=el('button','btn sm ghost',l); b.onclick=()=>{ closeMenu(); fn(); }; m.appendChild(b);};
  if(S.screen!=='home') add('Home',()=>{ S.screen='home'; stopTimer(); render(); });
  if(S.screen==='round') add('Round rules',()=>{ S.screen='intro'; stopTimer(); render(); });
  add('Load questions', importJSON);
  add('Export questions', exportJSON);
  const so=el('button','btn sm ghost','Start over');
  so.onclick=()=>{
    if(so.dataset.armed==='1'){ closeMenu(); resetAll(); return; }
    so.dataset.armed='1'; so.textContent='Click again to confirm'; so.classList.add('arm');
    clearTimeout(so._t); so._t=setTimeout(()=>{ so.dataset.armed=''; so.textContent='Start over'; so.classList.remove('arm'); }, 4000);
  };
  m.appendChild(so);
  m.appendChild(el('div','keys',
    '<div><kbd>Space</kbd>reveal / correct</div><div><kbd>&rarr;</kbd>next question</div><div><kbd>A B C D</kbd>pick an option</div><div><kbd>T</kbd>start or pause timer</div><div><kbd>Esc</kbd>back to home</div>'));
}

/* ---------- home ---------- */
function viewHome(){
  const w=el('div','stack');
  const hero=el('div','hero');
  hero.appendChild(logoNode());
  hero.insertAdjacentHTML('beforeend',
    `<h1 class="dtitle">Sucker <em>Punch</em><span style="display:block;font-size:.42em;letter-spacing:.12em;margin-top:.25em">Pub Quiz</span></h1>
     <p class="tag">Movies, martial arts, a one-minute squat, and epic wars.</p>`);
  w.appendChild(hero);
  const g=el('div','roundgrid');
  S.data.rounds.forEach((r,i)=>{
    const c=el('button','rcard');
    c.innerHTML=`<div class="no">${String(i+1).padStart(2,'0')}</div>
      <span class="diffpill${r.difficulty==='Hard'?' hot':''}">${esc(r.difficulty)}</span>
      <h3>${esc(r.subtitle)}</h3>`;
    c.onclick=()=>openRound(i);
    g.appendChild(c);
  });
  w.appendChild(g);
  return w;
}

/* ---------- round intro (rules + start) ---------- */
function openRound(i){ S.ri=i; S.screen='intro'; stopTimer(); render(); }
function viewIntro(){
  const r=R(), w=el('div','intro');
  w.appendChild(el('div','no', String(S.ri+1).padStart(2,'0')));
  w.appendChild(el('div','eyebrow', `${esc(r.name)} &middot; ${esc(r.difficulty)}`));
  const h=el('h2',null, esc(r.subtitle)); w.appendChild(h);
  const box=el('div','rulebox', `<ol>${r.rules.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`);
  w.appendChild(box);
  const b=el('button','btn primary huge','Start the round');
  b.onclick=()=>startRound();
  w.appendChild(b);
  return w;
}
function startRound(){
  const r=R();
  if(r.format==='open'){ S.r1.revealed=false; }
  if(r.format==='pick'){ S.r2.started=false; S.r2.revealed=false; }
  if(r.format==='rapid'){ S.r3.phase='ready'; S.r3.count=0; S.r3.seen=0; S.r3.asked=[]; }
  if(r.format==='mcq'){ S.r4.picked=null; }
  timerSet(r.timer||0);
  S.screen='round'; render();
}

/* ---------- round shell ---------- */
function viewRound(){
  const r=R(), w=el('div','stage');
  w.appendChild(el('div','stagehead',
    `<span class="diffpill${r.difficulty==='Hard'?' hot':''}">${esc(r.difficulty)}</span>
     <h2 class="dtitle">${esc(r.subtitle)}</h2><span class="counter" id="counter"></span>`));
  if(r.format==='open') w.appendChild(roundOpen(r));
  else if(r.format==='pick') w.appendChild(roundPick(r));
  else if(r.format==='rapid') w.appendChild(roundRapid(r));
  else if(r.format==='mcq') w.appendChild(roundMCQ(r));
  return w;
}
const setCounter = t => { const c=$('#counter'); if(c) c.textContent=t; };

/* ---------- R1: sequential, no timer ---------- */
function roundOpen(r){
  const st=S.r1, q=r.questions[st.i], w=el('div','stack');
  setTimeout(()=>setCounter(`${st.i+1} / ${r.questions.length}`),0);
  w.appendChild(el('div','qcard',
    `<div class="qtext">${esc(q.q)}</div>${st.revealed?`<div class="answer">${esc(q.a)}</div>`:''}`));
  const bar=el('div','bar');
  const rev=el('button','btn primary big', st.revealed?'Hide answer':'Reveal answer');
  rev.onclick=()=>{ st.revealed=!st.revealed; render(); };
  const prev=el('button','btn','&larr; Prev'); prev.disabled=st.i===0; prev.onclick=()=>go(-1);
  const next=el('button','btn','Next &rarr;'); next.disabled=st.i>=r.questions.length-1; next.onclick=()=>go(1);
  bar.append(rev,prev,next);
  w.appendChild(bar);
  function go(d){ st.i=Math.max(0,Math.min(r.questions.length-1,st.i+d)); st.revealed=false; render(); }
  return w;
}

/* ---------- R2: choose easy or difficult, random draw ---------- */
function roundPick(r){
  const st=S.r2, w=el('div','stack');
  const left = k => (k==='easy'?r.easyQuestions.length:r.hardQuestions.length) - st.used[k].length;

  if(!st.started){
    setTimeout(()=>setCounter(`Easy ${left('easy')} left · Difficult ${left('hard')} left`),0);
    w.appendChild(el('div','eyebrow','The team chooses'));
    const c=el('div','chips');
    [['easy',`Easy &middot; ${r.points.easy.full} pts`],['hard',`Difficult &middot; ${r.points.hard.full} pts`]].forEach(([k,lab])=>{
      const b=el('button','chip',lab); b.setAttribute('aria-pressed', st.tier===k);
      b.onclick=()=>{ st.tier=k; render(); }; c.appendChild(b);
    });
    w.appendChild(c);
    const bar=el('div','bar');
    const go=el('button','btn primary big','Draw a question');
    go.onclick=()=>{
      const pool = st.tier==='easy'?r.easyQuestions:r.hardQuestions;
      const i = pickRandom(pool, st.used[st.tier]);
      if(i===null){ toast('No unused questions left in that tier'); return; }
      st.used[st.tier].push(i); st.q=i; st.started=true; st.revealed=false;
      timerSet(r.timer); render(); startTimer();
    };
    bar.appendChild(go);
    w.appendChild(bar);
    return w;
  }

  const pool = st.tier==='easy'?r.easyQuestions:r.hardQuestions;
  const q = pool[st.q];
  setTimeout(()=>setCounter(`${st.tier==='easy'?'Easy':'Difficult'} · ${r.points[st.tier].full} pts`),0);
  w.appendChild(el('div','qcard',
    `<div class="qtext">${esc(q.q)}</div>${st.revealed?`<div class="answer">${esc(q.a)}</div>`:''}`));
  if(r.timer) w.insertAdjacentHTML('beforeend', timerBar());
  const bar=el('div','bar');
  const rev=el('button','btn primary big', st.revealed?'Hide answer':'Reveal answer');
  rev.onclick=()=>{ st.revealed=!st.revealed; stopTimer(); render(); };
  const nxt=el('button','btn big','Next question &rarr;');
  nxt.onclick=()=>{ st.started=false; st.revealed=false; stopTimer(); render(); };
  const short=el('button','btn ghost','Restart at 15s');
  short.onclick=()=>{ timerSet(r.timerShort); startTimer(); };
  bar.append(rev,nxt,short);
  w.appendChild(bar);
  if(r.handicaps && r.handicaps.length){
    const h=el('div','handicaps');
    h.innerHTML=`<span class="eyebrow">Handicaps on the table</span>
      <div class="chips">${r.handicaps.map(x=>`<span class="chip static">${esc(x)}</span>`).join('')}</div>`;
    w.appendChild(h);
  }
  return w;
}

/* ---------- R3: one-minute rapid fire ---------- */
function roundRapid(r){
  const st=S.r3, w=el('div','stack');

  if(st.phase==='ready'){
    setTimeout(()=>setCounter(`${r.questions.length-st.used.length} questions unused`),0);
    w.appendChild(el('div','qcard',
      `<div class="eyebrow">Nominate the squatter</div>
       <div class="qtext">One minute. As many as they can take.</div>
       <div class="note">Answers stay hidden &mdash; they all come up together when the minute is done</div>`));
    const bar=el('div','bar');
    const go=el('button','btn primary huge','Start 60 seconds');
    go.onclick=()=>{ st.phase='run'; st.count=0; st.seen=0; st.asked=[]; nextRapid(); timerSet(r.timer); render(); startTimer(); };
    bar.appendChild(go); w.appendChild(bar);
    return w;
  }

  if(st.phase==='run'){
    const q=r.questions[st.q];
    setTimeout(()=>setCounter(`${st.count} correct · ${st.seen} asked`),0);
    w.appendChild(el('div','qcard',`<div class="qtext">${esc(q.q)}</div>`));
    w.insertAdjacentHTML('beforeend', timerBar());
    const bar=el('div','bar');
    const ok=el('button','btn primary big','Correct &rarr;');
    ok.onclick=()=>{ markRapid(true); render(); };
    const pass=el('button','btn big','Pass &rarr;');
    pass.onclick=()=>{ markRapid(false); render(); };
    const end=el('button','btn ghost','End early');
    end.onclick=()=>{ st.phase='done'; stopTimer(); render(); };
    bar.append(ok,pass,end);
    w.appendChild(bar);
    w.appendChild(el('div','note','Space = correct &middot; Right arrow = pass'));
    return w;
  }

  // done — every question that was asked, with its answer
  setTimeout(()=>setCounter(`${st.count} correct · ${st.seen} asked`),0);
  const head=el('div','qcard');
  head.innerHTML=`<div class="eyebrow">Round over</div>
    <div class="tally"><span class="big">${st.count}</span><span>correct out of ${st.seen} asked</span></div>`;
  w.appendChild(head);
  const list=(st.asked||[]);
  if(list.length){
    w.appendChild(el('div','eyebrow','The answers'));
    const box=el('div','anslist');
    box.innerHTML=list.map((a,i)=>`<div class="ansrow${a.got?' got':''}">
        <span class="n">${String(i+1).padStart(2,'0')}</span>
        <span class="q">${esc(a.q)}</span>
        <span class="a">${esc(a.a)}</span></div>`).join('');
    w.appendChild(box);
  }
  const bar=el('div','bar');
  const again=el('button','btn primary big','Next squatter');
  again.onclick=()=>{ st.phase='ready'; render(); };
  bar.appendChild(again); w.appendChild(bar);
  return w;
}
function markRapid(got){
  const r=R(), st=S.r3, q=r.questions[st.q];
  if(!st.asked) st.asked=[];
  st.asked.push({q:q.q, a:q.a, got:!!got});
  if(got) st.count++;
  st.seen++;
  nextRapid();
}
function nextRapid(){
  const r=R(), st=S.r3;
  const i=pickRandom(r.questions, st.used);
  if(i===null){ st.used=[]; st.q=pickRandom(r.questions,[]); }
  else { st.used.push(i); st.q=i; }
}

/* ---------- R4: multiple choice ---------- */
function roundMCQ(r){
  const st=S.r4, q=r.questions[st.i], w=el('div','stack');
  const done = st.picked!==null && st.picked!==undefined;
  setTimeout(()=>setCounter(`${st.i+1} / ${r.questions.length}`),0);

  const card=el('div','qcard');
  card.appendChild(el('div','qtext', esc(q.q)));
  const opts=el('div','opts');
  q.options.forEach((o,i)=>{
    const isRight = i===q.correct, isPick = i===st.picked;
    let cls='opt pick';
    if(done && isRight) cls+=' correct';
    if(done && isPick && !isRight) cls+=' wrong';
    if(done && !isRight && !isPick) cls+=' dim';
    const b=el('button',cls,`<span class="lt">${'ABCD'[i]}</span><span>${esc(o)}</span>`);
    b.onclick=()=>{ st.picked = isPick ? null : i; render(); };
    opts.appendChild(b);
  });
  card.appendChild(opts);
  if(done){
    const right = st.picked===q.correct;
    card.appendChild(el('div','verdict'+(right?' right':' wrong'),
      right ? 'Correct' : `Wrong &mdash; the answer is ${'ABCD'[q.correct]}. ${esc(q.options[q.correct])}`));
  }
  w.appendChild(card);

  const bar=el('div','bar');
  const prev=el('button','btn','&larr; Prev'); prev.disabled=st.i===0; prev.onclick=()=>go(-1);
  const next=el('button','btn primary','Next &rarr;'); next.disabled=st.i>=r.questions.length-1; next.onclick=()=>go(1);
  bar.append(prev,next);
  if(done){
    const clr=el('button','btn ghost','Clear pick'); clr.onclick=()=>{ st.picked=null; render(); };
    bar.appendChild(clr);
  } else {
    bar.appendChild(el('span','note','Click an option &mdash; or press A, B, C, D'));
  }
  w.appendChild(bar);
  function go(d){ st.i=Math.max(0,Math.min(r.questions.length-1,st.i+d)); st.picked=null; render(); }
  return w;
}

/* ---------- JSON in / out ---------- */
function exportJSON(){
  const blob=new Blob([JSON.stringify(S.data,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='sucker-punch-questions.json'; document.body.appendChild(a); a.click(); a.remove();
  toast('Questions exported');
}
function importJSON(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=()=>{
    const f=inp.files[0]; if(!f) return;
    const fr=new FileReader();
    fr.onload=()=>{
      try{
        const d=JSON.parse(fr.result);
        if(!d.rounds||!Array.isArray(d.rounds)) throw new Error('no "rounds" array in that file');
        S.data=d; S.custom=true;
        S.r1={i:0,revealed:false};
        S.r2={tier:'easy',q:null,revealed:false,used:{easy:[],hard:[]},started:false};
        S.r3={phase:'ready',q:null,used:[],count:0,seen:0,asked:[]};
        S.r4={i:0,picked:null};
        S.custom=true; S.ri=0; S.screen='home'; render(); toast('Questions loaded');
      }catch(e){ toast('Could not read that file: '+e.message); }
    };
    fr.readAsText(f);
  };
  inp.click();
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e=>{
  if(e.target && (e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const r = S.screen!=='home' ? R() : null;
  const rapidRunning = !!(r && r.format==='rapid' && S.r3.phase==='run' && S.screen==='round');
  const key = e.key;

  if(key===' '||key==='Spacebar'||e.code==='Space'){
    e.preventDefault(); e.stopPropagation();
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
    if(rapidRunning){ markRapid(true); render(); return; }
    const b=$('#view .btn.primary'); if(b && !b.disabled) b.click();
    return;
  }
  if(key==='ArrowRight'){
    if(rapidRunning){ e.preventDefault(); markRapid(false); render(); return; }
    const b=[...document.querySelectorAll('#view .btn')].filter(x=>/Next/i.test(x.textContent)&&!x.disabled)[0];
    if(b){ e.preventDefault(); b.click(); }
    return;
  }
  if(key==='ArrowLeft'){
    const b=[...document.querySelectorAll('#view .btn')].filter(x=>/Prev/i.test(x.textContent)&&!x.disabled)[0];
    if(b){ e.preventDefault(); b.click(); }
    return;
  }
  if(r && r.format==='mcq' && S.screen==='round' && /^[a-dA-D]$/.test(key)){
    const i='abcd'.indexOf(key.toLowerCase());
    const q=r.questions[S.r4.i];
    if(q && i < q.options.length){ e.preventDefault(); S.r4.picked = (S.r4.picked===i? null : i); render(); }
    return;
  }
  if(key==='t'||key==='T'){ if($('#clock')){ e.preventDefault(); toggleTimer(); } return; }
  if(key==='Escape'){
    if(!$('#menu').hidden){ closeMenu(); return; }
    if(S.screen!=='home'){ S.screen='home'; stopTimer(); render(); }
  }
}, true);

/* ---------- boot ---------- */
$('#brand').onclick=()=>{ closeMenu(); S.screen='home'; stopTimer(); render(); };
$('#menubtn').onclick=e=>{
  e.stopPropagation();
  const m=$('#menu'), open=m.hidden;
  m.hidden=!open; $('#menubtn').setAttribute('aria-expanded', String(open));
};
document.addEventListener('click', e=>{
  const m=$('#menu');
  if(!m.hidden && !m.contains(e.target) && e.target!==$('#menubtn')) closeMenu();
});
(function(){
  const saved=load();
  if(saved){
    if(saved.data && saved.data.rounds){ S.data=saved.data; S.custom=true; }
    ['r1','r2','r3','r4'].forEach(k=>{ if(saved[k]) S[k]=Object.assign(S[k], saved[k]); });
    if(typeof saved.ri==='number') S.ri=saved.ri;
    if(saved.screen) S.screen=saved.screen;
    // keep every pointer inside the current question set
    S.ri=Math.min(S.ri, S.data.rounds.length-1);
    const cap=(v,n)=> (typeof v==='number' && v>=0 && v<n) ? v : 0;
    const q1=S.data.rounds[0].questions||[], q4=S.data.rounds[3].questions||[];
    S.r1.i=cap(S.r1.i,q1.length); S.r4.i=cap(S.r4.i,q4.length); S.r4.picked=null;
    const trim=(arr,n)=>(arr||[]).filter(i=>i<n);
    S.r2.used={easy:trim(S.r2.used&&S.r2.used.easy,(S.data.rounds[1].easyQuestions||[]).length),
               hard:trim(S.r2.used&&S.r2.used.hard,(S.data.rounds[1].hardQuestions||[]).length)};
    S.r2.started=false;
    S.r3.used=trim(S.r3.used,(S.data.rounds[2].questions||[]).length);
    if(S.r3.phase==='run') S.r3.phase='ready';
    S.t={total:0,left:0,on:false,id:null};
    if(S.screen==='round') timerSet(R().timer||0);
  }
  render();
})();
</script>
